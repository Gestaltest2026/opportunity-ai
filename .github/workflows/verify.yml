name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Hash regression
        run: npm run evaluate:hash

      - name: Databank schema regression
        run: npm run evaluate:databank-schema

      - name: Fixture schema validation
        run: npm run evaluate:fixtures

      - name: Pure domain regression
        run: npm run evaluate:domain

      - name: Discovery URL policy regression
        run: npm run evaluate:discovery-url-policy

      - name: Discovery candidate extraction regression
        run: npm run evaluate:discovery-candidates

      - name: Discovery candidate classification regression
        run: npm run evaluate:discovery-classification

      - name: Opportunity identity regression
        run: npm run evaluate:opportunity-identity

      - name: Raw change regression
        run: npm run evaluate:raw-change

      - name: Semantic change regression
        run: npm run evaluate:semantic-change

      - name: Stale source regression
        run: npm run evaluate:stale-source

      - name: Targeted rematch regression
        run: npm run evaluate:rematch-targets

      - name: Human exception queue regression
        run: npm run evaluate:exception-queue
