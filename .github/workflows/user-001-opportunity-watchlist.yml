name: User #1 Opportunity Watchlist

on:
  workflow_dispatch:
    inputs:
      max_sources:
        description: "Maximum due sources to fetch in this run"
        default: "20"
        required: false
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: user-001-opportunity-watchlist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor-watchlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify curated watchlist monitor
        run: npm run evaluate:curated-watchlist

      - name: Verify User #1 shortlist triage
        run: npm run evaluate:user-001-shortlist

      - name: Verify source coverage model
        run: npm run evaluate:source-coverage

      - name: Verify watchlist source merge
        run: npm run evaluate:watchlist-merge

      - name: Verify watchlist maintenance audit
        run: npm run evaluate:watchlist-maintenance

      - name: Verify Phase 2 readiness gate
        run: npm run evaluate:phase-2-readiness

      - name: Verify User #1 action gate
        run: npm run evaluate:user-001-action-gate

      - name: Verify User #1 execution packet
        run: npm run evaluate:user-001-execution-packet

      - name: Fold Phase 2 curated source additions into User #1 watchlist
        run: npm run watchlist:merge -- data/opportunity-source-universe/curated-watchlist.user-001.json data/opportunity-source-universe/curated-watchlist.user-001.json data/opportunity-source-universe/phase-2-source-additions.user-001.json data/opportunity-source-universe/phase-2-source-additions-50.user-001.json

      - name: Build User #1 source universe maintenance report
        run: npm run maintenance:user-001 -- data/opportunity-source-universe/curated-watchlist.user-001.json examples/applicant-001/source-universe-maintenance-v0.json examples/applicant-001/source-universe-maintenance-v0.md data/opportunity-source-universe/phase-2-source-additions.user-001.json data/opportunity-source-universe/phase-2-source-additions-50.user-001.json

      - name: Monitor curated User #1 opportunity sources
        run: npm run watchlist:user-001 -- data/opportunity-source-universe/curated-watchlist.user-001.json examples/applicant-001/opportunity-watchlist-report-v0.md --max-sources=${{ inputs.max_sources || 20 }}

      - name: Build guarded User #1 opportunity shortlist
        run: npm run shortlist:user-001 -- data/opportunity-source-universe/curated-watchlist.user-001.json examples/applicant-001/opportunity-shortlist-v0.json examples/applicant-001/opportunity-shortlist-v0.md examples/applicant-001/user-001-evidence-request-v0.md

      - name: Build User #1 source universe coverage report
        run: npm run coverage:user-001 -- data/opportunity-source-universe/curated-watchlist.user-001.json examples/applicant-001/source-universe-coverage-v0.json examples/applicant-001/source-universe-coverage-v0.md

      - name: Build User #1 Phase 2 readiness report
        run: npm run phase2:user-001 -- data/opportunity-source-universe/curated-watchlist.user-001.json examples/applicant-001/phase-2-readiness-v0.json examples/applicant-001/phase-2-readiness-v0.md data/opportunity-source-universe/phase-2-source-additions.user-001.json data/opportunity-source-universe/phase-2-source-additions-50.user-001.json

      - name: Build User #1 action gate report
        run: npm run action-gate:user-001 -- examples/applicant-001/phase-2-readiness-v0.json examples/applicant-001/user-001-action-ledger-v0.json examples/applicant-001/user-001-action-gate-v0.json examples/applicant-001/user-001-action-gate-v0.md

      - name: Build User #1 execution packet
        run: npm run execution-packet:user-001 -- examples/applicant-001/user-001-action-ledger-v0.json examples/applicant-001/user-001-action-gate-v0.json examples/applicant-001/user-001-evidence-request-v0.md examples/applicant-001/user-001-execution-packet-v0.md

      - name: Commit watchlist, shortlist, coverage, maintenance, readiness, action-gate, and execution-packet updates
        run: |
          git config user.name "opportunity-ai-bot"
          git config user.email "opportunity-ai-bot@users.noreply.github.com"
          git add \
            data/opportunity-source-universe/curated-watchlist.user-001.json \
            data/opportunity-source-universe/phase-2-source-additions.user-001.json \
            data/opportunity-source-universe/phase-2-source-additions-50.user-001.json \
            examples/applicant-001/opportunity-watchlist-report-v0.md \
            examples/applicant-001/opportunity-shortlist-v0.json \
            examples/applicant-001/opportunity-shortlist-v0.md \
            examples/applicant-001/user-001-evidence-request-v0.md \
            examples/applicant-001/source-universe-coverage-v0.json \
            examples/applicant-001/source-universe-coverage-v0.md \
            examples/applicant-001/source-universe-maintenance-v0.json \
            examples/applicant-001/source-universe-maintenance-v0.md \
            examples/applicant-001/phase-2-readiness-v0.json \
            examples/applicant-001/phase-2-readiness-v0.md \
            examples/applicant-001/user-001-action-gate-v0.json \
            examples/applicant-001/user-001-action-gate-v0.md \
            examples/applicant-001/user-001-execution-packet-v0.md
          git commit -m "Update User #1 opportunity execution packet" || echo "No User #1 opportunity updates"
          git push
