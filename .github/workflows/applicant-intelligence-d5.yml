name: Applicant Intelligence D5 Review Prep

on:
  workflow_dispatch:

jobs:
  prepare-d5-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify deterministic boundaries
        run: npm run verify

      - name: Prepare D5 review input
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run prepare:applicant-intelligence-d5

      - name: Print D5 baseline manifest
        run: cat examples/applicant-001/d5-baseline-manifest.json

      - name: Print D5 review input
        run: cat examples/applicant-001/d5-human-review-input.json

      - name: Print D5 epistemic diagnostics
        run: cat examples/applicant-001/d5-epistemic-diagnostics.json

      - name: Print D5 human review template
        run: cat examples/applicant-001/d5-human-review-template.json

      - name: Upload D5 review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: applicant-intelligence-d5-review
          path: |
            examples/applicant-001/d5-baseline-manifest.json
            examples/applicant-001/d5-human-review-input.json
            examples/applicant-001/d5-epistemic-diagnostics.json
            examples/applicant-001/d5-human-review-template.json
          if-no-files-found: error
